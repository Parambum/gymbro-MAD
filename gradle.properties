# Memory-tuned for a 8 GB laptop: Gradle builds here have died with native
# malloc failures when the daemon, the Kotlin compiler daemon and an IDE all
# wanted a heap at once. A smaller daemon heap plus an in-process Kotlin
# compiler keeps it to one JVM. Raise these if you build on a bigger machine.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=true

kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
